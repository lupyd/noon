<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Noon logo</title>
<style>
  @font-face { font-family: Inter; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #232156; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #title {
    position: fixed; left: 56%; top: 50%; transform: translateY(-50%);
    font-family: Inter, sans-serif; color: #f8e4a6; line-height: 1;
  }
  #title div { will-change: transform, opacity; opacity: 0; }
  #intro { font-size: 64px; font-weight: 500; letter-spacing: -0.01em; color: rgba(248, 228, 166, 0.72); margin: 0 0 14px 8px; }
  #name { font-size: 220px; font-weight: 800; letter-spacing: -0.045em; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><div id="intro">Introducing</div><div id="name">Noon</div></div>
<div id="fade"></div>
<script type="module">
// The logo is noon-logo.svg (traced from assets/noon.webp) rasterised once into a
// texture. A shader brings it to life: flames are displaced by polar noise that
// flows outward from the sun rims, and each spiral rotates inside its unbroken
// orange ring. At amp = 0 and spin = 0 the output is the static traced frame.
//
// Intro: open inside sun A's spiral, pull out to the whole logo while the
// spirals and then the flames come alive, slide the logo left and set
// "Introducing Noon" on the right.
//
// Query: ?t=<sec> shows a still, ?play plays in real time. __seek(t) is the
// deterministic hook for the renderer.

const W = 1920, H = 1080, LOGO = 1024
const TEX = 8192      // scene raster; 8 texels per logo px keeps the 6x opening sharp
const STAR_TEX = 4096
const ZOOM0 = 4.6       // opening magnification over the full-frame logo
const SPIN = 28       // spiral rotation, degrees per second at full speed
const T = {
  fade: [0, 0.5],     // in from black
  spin: [0, 0.9],     // spirals come up to speed
  zoom: [0.2, 3.6],   // pull out from the spiral to the whole logo
  flames: [1.6, 3.4], // flames come alive as they enter frame
  slide: [4.1, 5.2],  // logo moves left
  intro: [4.55, 5.25],
  name: [4.7, 5.5],
}
const DURATION = 7.5
const SLIDE_X = 0.3   // logo centre after the slide, fraction of width
const SLIDE_SIZE = 0.8
// Flames + suns occupy x 168-874, y 194-861 of the 1024 square; frame that
// content (not the square) at 82% of the height.
const CONTENT_C = [521, 527]
const FULL = (0.82 * H * LOGO) / 667

const svgText = await (await fetch('noon-logo.svg')).text()
const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml')
const suns = ['a', 'b'].map((id) => {
  const g = doc.getElementById(`sun-${id}`)
  return { c: [+g.dataset.cx, +g.dataset.cy], r: +g.dataset.r, rim: +g.dataset.rim }
})
// Inside each spin circle the sun content equals the flame stack beneath it, so
// one texture of the stack serves both; the sun groups are not rasterised.
for (const id of ['a', 'b']) doc.getElementById(`sun-${id}`).remove()

// Two rasters: the scene without stars (it gets warped) and the stars alone on
// transparent (drawn on top, unwarped, so they never smear with the flames).
async function raster(size, edit) {
  const d = doc.cloneNode(true)
  d.documentElement.setAttribute('width', size)
  d.documentElement.setAttribute('height', size)
  edit(d)
  const img = new Image()
  img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(d)], { type: 'image/svg+xml' }))
  await img.decode()
  const c = document.createElement('canvas')
  c.width = c.height = size
  c.getContext('2d').drawImage(img, 0, 0, size, size)
  return c
}
const sceneTex = await raster(TEX, (d) => d.getElementById('stars').remove())
const starTex = await raster(STAR_TEX, (d) => {
  for (const el of [...d.documentElement.children]) if (el.id !== 'stars') el.remove()
})

const canvas = document.getElementById('c')
canvas.width = W
canvas.height = H
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false })

const vs = `attribute vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }`
const fs = `
precision highp float;
uniform sampler2D uTex, uStars;
uniform vec2 uRes;
uniform vec3 uRect;          // logo square: x, y (top-left, px), size (px)
uniform float uT, uAmp;
uniform vec2 uAngle;         // spiral rotation per sun, radians
uniform vec4 uSun[2];        // spin centre xy, spin radius, rim radius (logo px)
uniform vec2 uRimC[2];       // rim centre (logo px)

// Ashima 3D simplex noise (MIT)
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}

vec4 tex(vec2 p) { return texture2D(uTex, p / ${LOGO}.0); }

vec2 rot(vec2 v, float a) { float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }

// Flame displacement around one sun: tongues sway sideways and lick outward,
// with the noise field drifting away from the rim so motion reads as rising.
vec2 flame(vec2 p, vec2 c, float rim, float seed, out float rho) {
  vec2 v = p - c;
  float d = length(v);
  vec2 dir = v / max(d, 1e-3);
  vec2 tan = vec2(-dir.y, dir.x);
  rho = d - rim;
  float f = rho * 0.011 - uT * 0.8;
  vec3 q = vec3(dir * 2.4 + seed, f);
  float sway = snoise(q) + 0.15 * snoise(vec3(dir * 4.0 - seed, rho * 0.024 - uT * 1.4));
  float lick = snoise(q + vec3(11.7, 4.3, 2.9));
  // Bases stay planted on the red ring; tips move the most.
  float reach = smoothstep(6.0, 48.0, rho) * (0.55 + 0.45 * smoothstep(40.0, 140.0, rho));
  return (tan * sway * 13.0 + dir * lick * 6.0) * reach;
}

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 p = (frag - uRect.xy) / uRect.z * ${LOGO}.0;

  // Stars sit on top, unwarped, each twinkling on its own phase.
  vec4 st = texture2D(uStars, p / ${LOGO}.0);
  float tw = 1.0 - 0.45 * uAmp * (0.5 + 0.5 * snoise(vec3(floor(p / 24.0) * 1.7, uT * 0.9)));
  st.a *= tw;

  for (int k = 0; k < 2; k++) {
    vec2 c = uSun[k].xy;
    if (length(p - c) < uSun[k].z) {
      float a = k == 0 ? uAngle.x : uAngle.y;
      gl_FragColor = tex(c + rot(p - c, -a));
      return;
    }
  }

  float r0, r1;
  vec2 d0 = flame(p, uRimC[0], uSun[0].w, 0.0, r0);
  vec2 d1 = flame(p, uRimC[1], uSun[1].w, 37.0, r1);
  // Blend the two suns' fields by proximity so there is no crease between them.
  float w0 = exp(-max(r0, 0.0) / 28.0), w1 = exp(-max(r1, 0.0) / 28.0);
  vec2 d = (d0 * w0 + d1 * w1) / max(w0 + w1, 1e-4);
  d *= smoothstep(6.0, 30.0, min(r0, r1));
  vec2 q = p - d * uAmp;
  vec4 col = (q.x < 0.0 || q.y < 0.0 || q.x > ${LOGO}.0 || q.y > ${LOGO}.0) ? tex(vec2(4.0)) : tex(q);
  gl_FragColor = vec4(mix(col.rgb, st.rgb / max(st.a, 1e-4) * (st.a > 0.0 ? 1.0 : 0.0), st.a), 1.0);
}`

function shader(type, src) {
  const s = gl.createShader(type)
  gl.shaderSource(s, src)
  gl.compileShader(s)
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
  return s
}
const prog = gl.createProgram()
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs))
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs))
gl.linkProgram(prog)
gl.useProgram(prog)
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
gl.enableVertexAttribArray(0)
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)

function upload(unit, src) {
  gl.activeTexture(gl.TEXTURE0 + unit)
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture())
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src)
  gl.generateMipmap(gl.TEXTURE_2D)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
}
// Straight (non-premultiplied) alpha for the star layer.
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false)
upload(0, sceneTex)
upload(1, starTex)

const U = (n) => gl.getUniformLocation(prog, n)
gl.uniform1i(U('uTex'), 0)
gl.uniform1i(U('uStars'), 1)
gl.uniform2f(U('uRes'), W, H)
gl.uniform4fv(U('uSun'), suns.flatMap((s) => [s.c[0], s.c[1], s.r, s.rim]))
// Rim radii were fitted around their own centres; the spin centre is within a
// few px of it, close enough to share for the flame field.
gl.uniform2fv(U('uRimC'), suns.flatMap((s) => s.c))

const clamp01 = (u) => Math.min(1, Math.max(0, u))
const prog01 = ([a, b], t) => clamp01((t - a) / (b - a))
const smooth = (u) => u * u * (3 - 2 * u)
const inOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2)
const outQuint = (u) => 1 - Math.pow(1 - u, 5)
// Integral of smooth() from 0 to u, so spin angle is continuous through the ramp.
const smoothInt = (u) => (u <= 0 ? 0 : u >= 1 ? u - 0.5 : u * u * u - (u * u * u * u) / 2)

// Camera: the logo square's on-screen size and the screen point of a focus
// point in logo px. Zoom is eased in log space so the pull-out feels constant;
// the focus travels in proportion to the view width, so it never whips across
// the frame while magnified.
const focus0 = suns[0].c
function camera(t) {
  const z = Math.exp(Math.log(ZOOM0) * (1 - inOut(prog01(T.zoom, t))))
  const w = (1 / z - 1 / ZOOM0) / (1 - 1 / ZOOM0)
  const fx = focus0[0] + (CONTENT_C[0] - focus0[0]) * w
  const fy = focus0[1] + (CONTENT_C[1] - focus0[1]) * w
  const s = outQuint(prog01(T.slide, t))
  const size = FULL * z * (1 + (SLIDE_SIZE - 1) * s)
  const cx = W / 2 + (W * SLIDE_X - W / 2) * s
  return [cx - (fx / LOGO) * size, H / 2 - (fy / LOGO) * size, size]
}

const fade = document.getElementById('fade')
const lines = [['intro', T.intro], ['name', T.name]].map(([id, r]) => [document.getElementById(id).style, r])
await document.fonts.load('800 100px Inter')

function draw(t) {
  const angle = ((SPIN * Math.PI) / 180) * (T.spin[1] - T.spin[0]) * smoothInt((t - T.spin[0]) / (T.spin[1] - T.spin[0]))
  gl.uniform1f(U('uT'), t)
  gl.uniform1f(U('uAmp'), smooth(prog01(T.flames, t)))
  gl.uniform2f(U('uAngle'), angle, angle)
  gl.uniform3f(U('uRect'), ...camera(t))
  gl.viewport(0, 0, W, H)
  gl.drawArrays(gl.TRIANGLES, 0, 3)
  fade.style.opacity = String(1 - smooth(prog01(T.fade, t)))
  for (const [st, r] of lines) {
    const u = outQuint(prog01(r, t))
    st.opacity = String(u)
    st.transform = `translateY(${(1 - u) * 36}px)`
  }
}

window.__duration = DURATION
window.__seek = async (t) => draw(t)
const q = new URLSearchParams(location.search)
if (q.has('play')) {
  const t0 = performance.now()
  const loop = () => (draw((performance.now() - t0) / 1000), requestAnimationFrame(loop))
  loop()
} else draw(+(q.get('t') ?? 0))
window.__ready = true
</script>
</body>
</html>
